<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — A2G TEST</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; }
  .auth-wrap { width: 100%; max-width: 420px; }
  .auth-logo { text-align: center; margin-bottom: 40px; }
  .auth-logo a { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 0.04em; }
  .auth-logo a span { color: var(--accent); }
  .auth-logo .dot { color: var(--accent2); }
  .auth-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 36px 40px; }
  .auth-header { margin-bottom: 28px; }
  .auth-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
  .auth-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .auth-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .btn-full { width: 100%; justify-content: center; padding: 13px 20px; font-size: 14px; border-radius: 8px; margin-top: 4px; }
  .auth-footer { text-align: center; margin-top: 24px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .auth-footer a { color: var(--accent); text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }
  .forgot { font-family: var(--mono); font-size: 11px; color: var(--muted); text-decoration: none; text-align: right; display: block; margin-top: -12px; margin-bottom: 20px; }
  .forgot:hover { color: var(--text); }
  .divider-or { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
  .divider-or span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .demo-accounts {
    background: rgba(108,99,255,0.07); border: 0.5px solid rgba(108,99,255,0.15);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 20px;
  }
  .demo-title { font-family: var(--mono); font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .demo-item { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; }
  .demo-item:last-child { margin-bottom: 0; }
  .demo-badge { background: rgba(108,99,255,0.2); color: var(--accent); border-radius: 3px; padding: 1px 6px; font-size: 10px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="auth-wrap fade-in">
  <div class="auth-logo">
    <a href="index.html"><span>A2G</span> TEST<span class="dot">.</span></a>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Bem-vindo de volta</h1>
      <p class="auth-sub">Acesse sua conta para gerenciar seus casos de teste.</p>
    </div>

    <div class="demo-accounts">
      <div class="demo-title">// Contas de demonstração</div>
      <div class="demo-item"><span class="demo-badge">admin</span> admin@a2gtest.com</div>
      <div class="demo-item"><span class="demo-badge">qa</span> qa@a2gtest.com</div>
      <div class="demo-item"><span class="demo-badge">viewer</span> viewer@a2gtest.com</div>
    </div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" type="email" placeholder="seu@email.com" value="admin@a2gtest.com" />
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" type="password" placeholder="••••••••••" value="••••••••" />
    </div>

    <a class="forgot" href="#">Esqueceu a senha?</a>

    <a class="btn btn-primary btn-full" href="dashboard.html">Entrar →</a>


  <div class="auth-footer">
    Não tem uma conta? <a href="register.html">Criar conta grátis</a>
  </div>
</div>
</body>
</html>
