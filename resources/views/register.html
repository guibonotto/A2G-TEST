<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar conta — A2G TEST</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; }
  .auth-wrap { width: 100%; max-width: 440px; }
  .auth-logo { text-align: center; margin-bottom: 40px; }
  .auth-logo a { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 0.04em; }
  .auth-logo a span { color: var(--accent); }
  .auth-logo .dot { color: var(--accent2); }
  .auth-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 36px 40px; }
  .auth-header { margin-bottom: 28px; }
  .auth-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
  .auth-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .auth-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .btn-full { width: 100%; justify-content: center; padding: 13px 20px; font-size: 14px; border-radius: 8px; margin-top: 4px; }
  .auth-footer { text-align: center; margin-top: 24px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .auth-footer a { color: var(--accent); text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .divider-or { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
  .divider-or span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 24px; }
  .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .step-dot.active { background: var(--accent); width: 20px; border-radius: 3px; }
  .role-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0; }
  .role-option { position: relative; }
  .role-option input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .role-label {
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px 16px; border-radius: 8px;
    border: 0.5px solid var(--border); background: var(--surface2);
    cursor: pointer; transition: all 0.15s;
  }
  .role-label:hover { border-color: var(--border-hover); }
  .role-option input:checked + .role-label { border-color: var(--accent); background: rgba(108,99,255,0.08); }
  .role-name { font-size: 13px; font-weight: 700; }
  .role-desc { font-family: var(--mono); font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="auth-wrap fade-in">
  <div class="auth-logo">
    <a href="index.html"><span>A2G</span> TEST<span class="dot">.</span></a>
  </div>

  <div class="auth-card">
    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>
    <div class="auth-header">
      <div class="auth-tag">// US-19 — Criar conta</div>
      <h1 class="auth-title">Crie sua conta</h1>
      <p class="auth-sub">Junte-se ao A2G TEST e gerencie seus testes com eficiência.</p>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input class="form-input" type="text" placeholder="João" />
      </div>
      <div class="form-group">
        <label class="form-label">Sobrenome</label>
        <input class="form-input" type="text" placeholder="Silva" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" type="email" placeholder="joao@empresa.com" />
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" type="password" placeholder="••••••••••" />
    </div>

    <div class="form-group">
      <label class="form-label">Confirmar senha</label>
      <input class="form-input" type="password" placeholder="••••••••••" />
    </div>

    <div class="form-group">
      <label class="form-label" style="margin-bottom:12px;">Perfil de acesso</label>
      <div class="role-options">
        <div class="role-option">
          <input type="radio" name="role" id="role-qa" checked />
          <label class="role-label" for="role-qa">
            <span class="role-name">QA / Tester</span>
            <span class="role-desc">Criar e editar testes</span>
          </label>
        </div>
        <div class="role-option">
          <input type="radio" name="role" id="role-dev" />
          <label class="role-label" for="role-dev">
            <span class="role-name">Desenvolvedor</span>
            <span class="role-desc">Visualizar e executar</span>
          </label>
        </div>
        <div class="role-option">
          <input type="radio" name="role" id="role-admin" />
          <label class="role-label" for="role-admin">
            <span class="role-name">Administrador</span>
            <span class="role-desc">Acesso total</span>
          </label>
        </div>
        <div class="role-option">
          <input type="radio" name="role" id="role-viewer" />
          <label class="role-label" for="role-viewer">
            <span class="role-name">Visualizador</span>
            <span class="role-desc">Somente leitura</span>
          </label>
        </div>
      </div>
    </div>

    <a class="btn btn-primary btn-full" href="dashboard.html">Criar conta →</a>

    <div class="divider-or"><span>ou</span></div>
    <a class="btn btn-ghost btn-full" href="dashboard.html">Continuar com Google</a>
  </div>

  <div class="auth-footer">
    Já tem uma conta? <a href="login.html">Fazer login</a>
  </div>
</div>
</body>
</html>
